<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{c:title}}</title>
  <meta name="description" content="{{c:description}}">
  <meta name="theme-color" content="#0b2455">
  <link rel="canonical" href="{{s:brand.site_url}}{{c:canonicalPath}}">
  <link rel="icon" href="{{c:root}}img/own/favicon.svg" type="image/svg+xml">
  {{c:robots}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{c:ogTitle}}">
  <meta property="og:description" content="{{c:ogDescription}}">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ru_RU">
  <meta property="og:site_name" content="{{s:brand.name}}">
  <script>
    document.documentElement.classList.add('js');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');
  </script>
  <noscript><style>.cursor{display:none}</style></noscript>
  <link rel="preload" href="{{c:root}}fonts/alfa-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{c:root}}fonts/barlow-cond-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{c:root}}fonts/sourcesans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{c:root}}fonts/sourcesans-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <style>{{c:css}}</style>
</head>
<body class="{{c:bodyClass}}" data-page="{{c:pageId}}">
  <a class="skip" href="#main">{{t:a11y.skip}}</a>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="{{c:root}}index.html" aria-label="{{t:nav.home}}">
        <svg class="brand__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.5l-6.3 3.7 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
        <span class="brand__name">Dossi<em>efy</em></span>
      </a>
      <input type="checkbox" id="menu-toggle" class="menu-check sr-only" aria-label="{{t:nav.menu}}">
      <label for="menu-toggle" class="menu-btn"><span class="sr-only">{{t:nav.menu}}</span><i aria-hidden="true"></i></label>
      <nav class="nav" aria-label="{{t:nav.label}}">
{{c:nav}}
      </nav>
    </div>
    <div class="stripes" aria-hidden="true"></div>
  </header>
  <main id="main">
{{c:body}}
  </main>
  <footer class="site-footer">
    <div class="site-footer__top">
      <p class="site-footer__brand">Dossi<em>efy</em></p>
      <nav class="site-footer__links" aria-label="{{t:footer.label}}">
        <a href="{{c:root}}privacy/">{{t:footer.privacy}}</a>
        <a href="{{c:root}}credits/">{{t:footer.credits}}</a>
        <a href="{{c:root}}about/">{{t:footer.about}}</a>
      </nav>
    </div>
    <p class="site-footer__legal" lang="ru">{{r:footer.disclaimer}}</p>
  </footer>
{{c:scripts}}
</body>
</html>
